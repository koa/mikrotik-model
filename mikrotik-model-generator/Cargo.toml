[package]
name = "mikrotik-model-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
convert_case = "0.12.0"
proc-macro2 = { version = "1.0.107", features = [] }
syn = { version = "3.0.9", features = ["full"] }
darling = "0.24.1"
include_dir = "0.7.4"

[dev-dependencies]
prettyplease = "0.3.0"

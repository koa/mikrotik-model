[package]
name = "inspect-device"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0.104"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }
mikrotik-api={version="0.1.0", git="https://github.com/koa/mikrotik-api"}
encoding_rs = "0.8.44"
tokio-stream = "0.1.19"
mikrotik-model-generator={path="../mikrotik-model-generator"}
log = "0.4.35"
regex = "1.13.1"
lazy_static = "1.5.1"
convert_case = "0.12.0"
